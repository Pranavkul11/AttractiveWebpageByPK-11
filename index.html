<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Motivation</title>
  <style>
    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      margin: 0;
      overflow: hidden;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      animation: fadeIn 2s ease;
    }
    .quote-box {
      font-size: 1.5rem;
      padding: 20px 40px;
      background: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 0 15px #000;
      max-width: 700px;
      min-height: 120px;
      animation: fadeIn 2s ease;
    }
    .typing {
      border-right: 2px solid #fff;
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      animation: typing 4s steps(40, end), blink 0.7s step-end infinite alternate;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink {
      50% { border-color: transparent }
    }

    @keyframes fadeIn {
      from { opacity: 0 }
      to { opacity: 1 }
    }
  </style>
</head>
<body>
  <h1>🚀 Your Daily Dose of Motivation</h1>
  <div class="quote-box">
    <span id="quote" class="typing"></span>
  </div>

  <script>
    const quotes = [
      "Believe in yourself and all that you are.",
      "Your only limit is your mind.",
      "Push yourself, because no one else is going to do it for you.",
      "Dream it. Wish it. Do it.",
      "Great things never come from comfort zones.",
      "Don’t stop when you’re tired. Stop when you’re done.",
      "Wake up with determination. Go to bed with satisfaction.",
      "Little things make big days."
    ];

    let quoteIndex = 0;
    const quoteEl = document.getElementById("quote");

    function typeQuote() {
      quoteEl.classList.remove("typing");
      void quoteEl.offsetWidth; 
      quoteEl.textContent = quotes[quoteIndex];
      quoteEl.classList.add("typing");
      quoteIndex = (quoteIndex + 1) % quotes.length;
    }

    typeQuote(); 
    setInterval(typeQuote, 7000); 
  </script>
</body>
</html>
